server:
  port: 8085
spring:
  application:
    name: digitalfix-ms-rabbit-admin
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER}
          audiences: ${ENTRA_AUDIENCE}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:rabbitmq1:5672,rabbitmq2:5672}
    virtual-host: ${RABBITMQ_VHOST:digitalfix}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    requested-heartbeat: 15s
    channel-rpc-timeout: 5s
